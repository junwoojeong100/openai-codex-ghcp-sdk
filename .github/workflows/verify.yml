name: Verify bridge and offline runtimes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-coverage-${{ matrix.os }}-node-${{ matrix.node }}
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  offline-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --global @openai/codex@0.154.0
      - run: npx --no-install playwright install --with-deps chromium
      - name: Actual Codex, private PTY and browser with SDK doubles only
        run: node --test --test-concurrency=1 test/runtime/*.test.mjs
      - name: Native compatibility with SDK doubles
        if: ${{ !cancelled() }}
        shell: bash
        env:
          COMPATIBILITY_DEBUG: "1"
        run: npm run test:compatibility:runtime 2>&1 | tee "$RUNNER_TEMP/ghcp-compatibility.log"
      - name: Native stability with SDK doubles
        if: ${{ !cancelled() }}
        run: npm run test:stability:runtime -- --output .runtime/ci-stability
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-runtime-evidence-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/ghcp-compatibility.log
            .runtime/ci-stability/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
